# Version catalog de DatoPublico.
#
# FT00001 activó Kotlin multiplatform/JVM y `kotlin("test")`; FT00002 activó la
# serialización; FT00003 activó Flyway y el driver PostgreSQL; FT00004 activa el
# servidor Ktor (Netty) y el logging JSON. El resto de versiones (AGP, Compose
# Multiplatform, coroutines) quedan predeclaradas para que las features
# siguientes (FT00005+) las activen sin tocar la raíz del build.

[versions]
kotlin = "2.1.20"
agp = "8.7.3"
composeMultiplatform = "1.7.3"
ktor = "3.0.3"
kotlinxSerialization = "1.8.0"
kotlinxCoroutines = "1.10.1"
flyway = "11.20.3"
postgresql = "42.7.14"
logback = "1.5.12"
logstashLogback = "8.0"
androidMinSdk = "26"
androidTargetSdk = "35"
androidCompileSdk = "35"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# Flyway 10+ reparte los dialectos por motor: PostgreSQL necesita
# `flyway-database-postgresql` además del driver JDBC. Ambas van en la
# configuración `flyway` de `:backend` (no en el classpath de producción).
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }

# Logging estructurado: una línea JSON por evento en stdout (sin destino externo).
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstashLogback" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
# Tareas Flyway explícitas (`flywayMigrate`/`flywayInfo`); nunca se enganchan a
# `build`/`check` (la CI corre sin base de datos).
flyway = { id = "org.flywaydb.flyway", version.ref = "flyway" }
