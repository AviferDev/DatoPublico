org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# El compilador de Kotlin/Wasm de `:composeApp` necesita más heap que el default
# (en CI, con 7 GB, agotaba el daemon: "Not enough memory to run compilation").
kotlin.daemon.jvmargs=-Xmx4g

kotlin.code.style=official

# `:composeApp` usa androidx (activity-compose): AGP exige `useAndroidX`.
android.useAndroidX=true
android.nonTransitiveRClass=true
