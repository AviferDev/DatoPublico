services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: datopublico-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datopublico}
      POSTGRES_USER: ${POSTGRES_USER:-datopublico}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    ports:
      # Solo loopback.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datopublico} -d ${POSTGRES_DB:-datopublico}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
