# Version catalog de DatoPublico.
#
# FT00001 activó Kotlin multiplatform/JVM y `kotlin("test")`; FT00002 activó la
# serialización; FT00003 activó Flyway y el driver PostgreSQL; FT00004 activa el
# servidor Ktor (Netty) y el logging JSON; FT00005 activa Compose Multiplatform y
# AGP en `:composeApp`; FT00006 activa el motor de cliente Ktor (CIO) y su doble
# de test (`ktor-client-mock`); FT00008 activa la persistencia JDBC (driver
# PostgreSQL y pool HikariCP) para los repositorios de `:backend`; FT00015 activa
# los embeddings locales (ONNX Runtime en CPU) y el tokenizador XLM-R de DJL. Las
# versiones restantes (coroutines) quedan predeclaradas para que las features
# siguientes las activen sin tocar la raíz del build.

[versions]
kotlin = "2.1.20"
agp = "8.7.3"
composeMultiplatform = "1.7.3"
androidxActivityCompose = "1.9.3"
ktor = "3.0.3"
kotlinxSerialization = "1.8.0"
kotlinxCoroutines = "1.10.1"
flyway = "11.20.3"
postgresql = "42.7.14"
hikari = "6.3.3"
# Embeddings locales (FT00015): runtime ONNX en CPU + tokenizador XLM-R de DJL
# (que empaqueta las librerías nativas `libtokenizers`). No descargan artefactos
# de modelo: el `.onnx` y el `tokenizer.json` se aprovisionan fuera del gate.
onnxruntime = "1.20.0"
djl = "0.33.0"
logback = "1.5.12"
logstashLogback = "8.0"
androidMinSdk = "26"
androidTargetSdk = "35"
androidCompileSdk = "35"
detekt = "1.23.8"
cpd = "3.5"

[libraries]
# Entry point del cliente Android (Compose desde `activity`); `:composeApp` lo usa
# en `androidMain` como `MainActivity`.
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# Flyway 10+ reparte los dialectos por motor: PostgreSQL necesita
# `flyway-database-postgresql` además del driver JDBC. Ambas van en la
# configuración `flyway` de `:backend` (no en el classpath de producción).
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
# Pool de conexiones para los repositorios JDBC (FT00008). El driver PostgreSQL
# va además en la configuración `flyway` del módulo de backend.
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
# Doble de test del cliente Ktor: simula respuestas HTTP sin abrir sockets.
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# Embeddings locales (FT00015): runtime ONNX (CPU) y tokenizador XLM-R de DJL.
# `djl-api` trae las interfaces comunes (`NativeResource`, `NDManager`) que usa el
# tokenizador; `djl-tokenizers` incluye los nativos `libtokenizers` por plataforma.
onnxruntime = { module = "com.microsoft.onnxruntime:onnxruntime", version.ref = "onnxruntime" }
djl-tokenizers = { module = "ai.djl.huggingface:tokenizers", version.ref = "djl" }
djl-api = { module = "ai.djl:api", version.ref = "djl" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }

# Logging estructurado: una línea JSON por evento en stdout (sin destino externo).
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstashLogback" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
# Tareas Flyway explícitas (`flywayMigrate`/`flywayInfo`); nunca se enganchan a
# `build`/`check` (la CI corre sin base de datos).
flyway = { id = "org.flywaydb.flyway", version.ref = "flyway" }
# Gate de calidad: análisis estático (detekt) por módulo y detección de duplicación
# token-based (CPD de PMD, un `:cpdCheck` global). Se aplican desde la raíz.
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
cpd = { id = "de.aaschmid.cpd", version.ref = "cpd" }
