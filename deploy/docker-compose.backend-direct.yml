# Override de PRUEBAS (FT00041): publica el backend directamente y **no** arranca
# Nginx. Pensado para una prueba rápida por **HTTP**, **SIN TLS**.
#
# Uso:
#   docker compose -f deploy/docker-compose.prod.yml \
#     -f deploy/docker-compose.backend-direct.yml \
#     --env-file deploy/.env.production up -d
#
# - El backend se publica en "${BACKEND_PORT:-8080}:8080".
# - Nginx se excluye asignándole un `profile` que no se activa.
# - **NO hay HTTPS** ni terminación TLS: es solo para pruebas, nunca producción.

services:
  backend:
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  nginx:
    profiles:
      - nginx
